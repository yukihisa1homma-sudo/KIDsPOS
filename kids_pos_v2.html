
<style>
*{box-sizing:border-box;margin:0;padding:0}
.app{font-family:var(--font-sans);display:grid;grid-template-columns:1fr 340px;gap:0;min-height:680px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden}
.left-panel{padding:14px;border-right:0.5px solid var(--color-border-tertiary);overflow-y:auto;max-height:680px}
.right-panel{display:flex;flex-direction:column;max-height:680px}
.section-label{font-size:11px;font-weight:500;color:var(--color-text-secondary);letter-spacing:.06em;margin-bottom:8px}
.cat-tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.cat-tab{padding:4px 10px;border-radius:20px;border:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);font-size:12px;cursor:pointer;color:var(--color-text-secondary);transition:all .1s}
.cat-tab.on{background:#1a1a2e;color:#fff;border-color:#1a1a2e}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.pbtn{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px 6px;cursor:pointer;text-align:center;transition:all .1s;user-select:none}
.pbtn:hover{background:var(--color-background-secondary)}
.pbtn:active{transform:scale(.95)}
.pemoji{font-size:26px;display:block;margin-bottom:4px}
.pname{font-size:12px;font-weight:500;color:var(--color-text-primary);display:block;margin-bottom:2px}
.pprice{font-size:11px;color:var(--color-text-secondary)}

.rhead{background:#1a1a2e;color:#fff;padding:12px 14px}
.rhead-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.store-nm{font-size:14px;font-weight:500;letter-spacing:.05em}
.member-area{display:flex;align-items:center;gap:6px}
.member-badge{font-size:11px;background:rgba(255,255,255,.15);padding:3px 8px;border-radius:12px;cursor:pointer}
.member-badge.has-member{background:#EAF3DE;color:#27500A}
.tax-toggle{display:flex;gap:0;border:0.5px solid rgba(255,255,255,.3);border-radius:6px;overflow:hidden}
.ttbtn{padding:4px 10px;font-size:11px;cursor:pointer;background:transparent;color:rgba(255,255,255,.6);border:none;transition:all .1s}
.ttbtn.on{background:rgba(255,255,255,.2);color:#fff;font-weight:500}

.items-area{flex:1;overflow-y:auto;padding:10px 14px;min-height:180px}
.empty-state{text-align:center;padding:32px 0;color:var(--color-text-secondary);font-size:13px}
.ritem{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:0.5px solid var(--color-border-tertiary)}
.ritem:last-child{border-bottom:none}
.ri-emoji{font-size:16px;flex-shrink:0}
.ri-info{flex:1;min-width:0}
.ri-name{font-size:12px;font-weight:500;color:var(--color-text-primary)}
.ri-detail{font-size:11px;color:var(--color-text-secondary)}
.ri-sub{font-size:12px;font-weight:500;color:var(--color-text-primary);flex-shrink:0}
.rm-btn{background:none;border:none;cursor:pointer;color:var(--color-text-secondary);font-size:15px;padding:1px 3px;border-radius:3px;line-height:1}
.rm-btn:hover{color:#e24b4a}

.rfooter{padding:10px 14px;border-top:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary)}
.discount-row{display:flex;gap:6px;margin-bottom:8px}
.coupon-input{flex:1;font-size:12px;padding:5px 8px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary)}
.apply-btn{padding:5px 10px;font-size:12px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);cursor:pointer;color:var(--color-text-primary);white-space:nowrap}
.apply-btn:hover{background:var(--color-background-tertiary)}
.summary-table{width:100%;font-size:12px;margin-bottom:8px;border-collapse:collapse}
.summary-table td{padding:2px 0}
.summary-table td:last-child{text-align:right}
.st-muted{color:var(--color-text-secondary)}
.st-discount{color:#639922}
.st-total{font-size:16px;font-weight:500;color:var(--color-text-primary);border-top:0.5px solid var(--color-border-tertiary)}
.st-total td{padding-top:6px}
.pts-row{font-size:11px;color:#639922;margin-bottom:8px;text-align:right}
.pay-btn{width:100%;padding:10px;background:#1a1a2e;color:#fff;border:none;border-radius:var(--border-radius-md);font-size:14px;font-weight:500;cursor:pointer;transition:opacity .15s}
.pay-btn:hover:not(:disabled){opacity:.85}
.pay-btn:disabled{opacity:.3;cursor:not-allowed}
.sub-btns{display:flex;gap:6px;margin-top:6px}
.sub-btn{flex:1;padding:6px;font-size:11px;background:none;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);cursor:pointer;color:var(--color-text-secondary);transition:background .1s}
.sub-btn:hover{background:var(--color-background-secondary)}

.overlay{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.modal{background:var(--color-background-primary);border-radius:var(--border-radius-lg);padding:22px 20px;width:260px;border:0.5px solid var(--color-border-tertiary)}
.modal-title{font-size:15px;font-weight:500;margin-bottom:14px;color:var(--color-text-primary)}
.modal input{width:100%;font-size:13px;padding:7px 10px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);margin-bottom:8px}
.modal-btns{display:flex;gap:8px;margin-top:4px}
.mbtn-primary{flex:1;padding:8px;background:#1a1a2e;color:#fff;border:none;border-radius:var(--border-radius-md);font-size:13px;cursor:pointer}
.mbtn-cancel{flex:1;padding:8px;background:none;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);font-size:13px;cursor:pointer;color:var(--color-text-secondary)}
.member-card{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 12px;margin-bottom:12px;display:flex;align-items:center;gap:10px;border:0.5px solid var(--color-border-tertiary)}
.member-avatar{width:36px;height:36px;border-radius:50%;background:#B5D4F4;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:#0C447C;flex-shrink:0}
.member-name{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.member-pts{font-size:11px;color:var(--color-text-secondary)}
.member-logout{margin-left:auto;font-size:11px;color:var(--color-text-secondary);cursor:pointer;background:none;border:none;padding:2px 4px}
.member-logout:hover{color:#e24b4a}
.tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:500}
.tag-green{background:#EAF3DE;color:#27500A}
.tag-amber{background:#FAEEDA;color:#633806}
.tag-red{background:#FCEBEB;color:#791F1F}
.coupon-applied{font-size:11px;color:#639922;margin-top:4px}
.err-msg{font-size:11px;color:#e24b4a;margin-top:4px}
.complete-modal{text-align:center}
.complete-emoji{font-size:44px;display:block;margin-bottom:10px}
.complete-ttl{font-size:16px;font-weight:500;margin-bottom:4px;color:var(--color-text-primary)}
.complete-sub{font-size:12px;color:var(--color-text-secondary);margin-bottom:14px;line-height:1.6}
.complete-total{font-size:24px;font-weight:500;color:var(--color-text-primary);margin-bottom:14px}
.pt-earned{display:inline-block;font-size:12px;background:#EAF3DE;color:#27500A;padding:4px 12px;border-radius:10px;margin-bottom:14px}
.members-list{max-height:200px;overflow-y:auto}
.mlist-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:0.5px solid var(--color-border-tertiary);cursor:pointer}
.mlist-item:last-child{border-bottom:none}
.mlist-item:hover .mlist-name{color:#185FA5}
.mlist-name{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.mlist-pts{font-size:11px;color:var(--color-text-secondary)}
.new-member-link{font-size:12px;color:#185FA5;cursor:pointer;margin-top:10px;display:block;text-align:center}
</style>

<h2 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">子ども向けPOSシステム v2 — 会員・割引・ポイント対応レジ</h2>

<div style="position:relative">
<div class="app" id="app">
  <div class="left-panel">
    <div class="section-label"><i class="ti ti-shopping-bag" aria-hidden="true" style="font-size:13px;vertical-align:-1px;margin-right:4px"></i>商品</div>
    <div class="cat-tabs" id="cats"></div>
    <div class="pgrid" id="pgrid"></div>
  </div>

  <div class="right-panel">
    <div class="rhead">
      <div class="rhead-top">
        <span class="store-nm">🏪 HAPPY MART</span>
        <div class="member-area">
          <span class="member-badge" id="member-badge" onclick="openMemberModal()">
            <i class="ti ti-user" aria-hidden="true" style="font-size:12px;vertical-align:-1px;margin-right:3px"></i>会員
          </span>
        </div>
      </div>
      <div class="tax-toggle">
        <button class="ttbtn on" id="tt10" onclick="setTax(10)">イートイン 10%</button>
        <button class="ttbtn" id="tt8" onclick="setTax(8)">お持ち帰り 8%</button>
      </div>
    </div>

    <div id="member-display"></div>

    <div class="items-area" id="items-area">
      <div class="empty-state"><span style="font-size:24px;display:block;margin-bottom:6px">🛒</span>商品を選んでください</div>
    </div>

    <div class="rfooter">
      <div class="discount-row">
        <input class="coupon-input" id="coupon-input" placeholder="割引コード（例: HAPPY10）" />
        <button class="apply-btn" onclick="applyCoupon()">適用</button>
      </div>
      <div id="coupon-msg"></div>

      <table class="summary-table" id="summary-table">
        <tr><td class="st-muted">小計</td><td id="s-subtotal">¥0</td></tr>
        <tr><td class="st-muted" id="s-tax-label">消費税（10%）</td><td id="s-tax">¥0</td></tr>
        <tr id="s-disc-row" style="display:none"><td class="st-discount"><i class="ti ti-tag" aria-hidden="true" style="font-size:12px;vertical-align:-1px;margin-right:3px"></i>割引</td><td class="st-discount" id="s-disc">-¥0</td></tr>
        <tr id="s-pts-row" style="display:none"><td class="st-discount"><i class="ti ti-star" aria-hidden="true" style="font-size:12px;vertical-align:-1px;margin-right:3px"></i>ポイント利用</td><td class="st-discount" id="s-pts-use">-¥0</td></tr>
        <tr class="st-total"><td>合計</td><td id="s-total">¥0</td></tr>
      </table>

      <div id="pts-earn-row" style="display:none" class="pts-row"></div>
      <button class="pay-btn" id="pay-btn" disabled onclick="openPayModal()">
        <i class="ti ti-credit-card" aria-hidden="true" style="font-size:15px;vertical-align:-2px;margin-right:5px"></i>お会計する
      </button>
      <div class="sub-btns">
        <button class="sub-btn" onclick="usePts()"><i class="ti ti-star" aria-hidden="true" style="font-size:13px;vertical-align:-1px;margin-right:3px"></i>ポイント使う</button>
        <button class="sub-btn" onclick="clearAll()"><i class="ti ti-trash" aria-hidden="true" style="font-size:13px;vertical-align:-1px;margin-right:3px"></i>クリア</button>
      </div>
    </div>
  </div>
</div>

<div id="overlay-area"></div>
</div>

<script>
const PRODUCTS=[
  {id:1,name:"おにぎり",emoji:"🍙",price:120,cat:"食べ物"},
  {id:2,name:"サンドイッチ",emoji:"🥪",price:280,cat:"食べ物"},
  {id:3,name:"から揚げ",emoji:"🍗",price:200,cat:"食べ物"},
  {id:4,name:"ラーメン",emoji:"🍜",price:450,cat:"食べ物"},
  {id:5,name:"ハンバーガー",emoji:"🍔",price:380,cat:"食べ物"},
  {id:6,name:"ケーキ",emoji:"🍰",price:320,cat:"スイーツ"},
  {id:7,name:"アイス",emoji:"🍦",price:150,cat:"スイーツ"},
  {id:8,name:"チョコ",emoji:"🍫",price:180,cat:"スイーツ"},
  {id:9,name:"ジュース",emoji:"🧃",price:130,cat:"飲み物"},
  {id:10,name:"コーヒー",emoji:"☕",price:220,cat:"飲み物"},
  {id:11,name:"コーラ",emoji:"🥤",price:160,cat:"飲み物"},
  {id:12,name:"ほうじ茶",emoji:"🍵",price:140,cat:"飲み物"},
  {id:13,name:"えんぴつ",emoji:"✏️",price:80,cat:"文具"},
  {id:14,name:"ノート",emoji:"📓",price:200,cat:"文具"},
  {id:15,name:"消しゴム",emoji:"🧽",price:100,cat:"文具"},
  {id:16,name:"おもちゃ",emoji:"🧸",price:680,cat:"おもちゃ"},
];

const COUPONS={
  "HAPPY10":{type:"pct",val:10,label:"10%オフ"},
  "HAPPY50":{type:"fixed",val:50,label:"50円引き"},
  "MEMBER20":{type:"pct",val:20,label:"会員20%オフ"},
  "SALE100":{type:"fixed",val:100,label:"100円引き"},
};

let MEMBERS=[
  {id:1,name:"田中 さくら",pts:320,initials:"田"},
  {id:2,name:"山田 たろう",pts:80,initials:"山"},
  {id:3,name:"鈴木 はな",pts:550,initials:"鈴"},
];

let cart=[];
let taxRate=10;
let currentCat="すべて";
let coupon=null;
let currentMember=null;
let usingPts=0;

const CATS=["すべて",...new Set(PRODUCTS.map(p=>p.cat))];

function renderCats(){
  document.getElementById("cats").innerHTML=CATS.map(c=>
    `<button class="cat-tab${c===currentCat?" on":""}" onclick="selectCat('${c}')">${c}</button>`
  ).join("");
}
function selectCat(c){currentCat=c;renderCats();renderProducts();}
function renderProducts(){
  const list=currentCat==="すべて"?PRODUCTS:PRODUCTS.filter(p=>p.cat===currentCat);
  document.getElementById("pgrid").innerHTML=list.map(p=>
    `<button class="pbtn" onclick="addItem(${p.id})">
      <span class="pemoji">${p.emoji}</span>
      <span class="pname">${p.name}</span>
      <span class="pprice">¥${p.price}</span>
    </button>`
  ).join("");
}
function addItem(id){
  const p=PRODUCTS.find(x=>x.id===id);
  const ex=cart.find(x=>x.id===id);
  if(ex)ex.qty++;
  else cart.push({...p,qty:1});
  usingPts=0;
  renderReceipt();
}
function removeItem(id){
  const i=cart.findIndex(x=>x.id===id);
  if(i<0)return;
  cart[i].qty--;
  if(cart[i].qty<=0)cart.splice(i,1);
  usingPts=0;
  renderReceipt();
}
function clearAll(){cart=[];coupon=null;usingPts=0;document.getElementById("coupon-input").value="";document.getElementById("coupon-msg").innerHTML="";renderReceipt();}

function calcSubtotal(){return cart.reduce((s,x)=>s+x.price*x.qty,0);}
function calcTax(sub){return Math.round(sub*taxRate/(100+taxRate));}
function calcDiscount(sub){
  if(!coupon)return 0;
  if(coupon.type==="pct")return Math.round(sub*coupon.val/100);
  return Math.min(coupon.val,sub);
}
function calcTotal(){
  const sub=calcSubtotal();
  const disc=calcDiscount(sub);
  const afterDisc=Math.max(0,sub-disc);
  return Math.max(0,afterDisc-usingPts);
}
function calcEarnPts(){
  return Math.floor(calcTotal()/100);
}

function renderReceipt(){
  const area=document.getElementById("items-area");
  if(cart.length===0){
    area.innerHTML=`<div class="empty-state"><span style="font-size:24px;display:block;margin-bottom:6px">🛒</span>商品を選んでください</div>`;
  } else {
    area.innerHTML=cart.map(it=>
      `<div class="ritem">
        <span class="ri-emoji">${it.emoji}</span>
        <div class="ri-info">
          <div class="ri-name">${it.name}</div>
          <div class="ri-detail">¥${it.price} × ${it.qty}</div>
        </div>
        <span class="ri-sub">¥${(it.price*it.qty).toLocaleString()}</span>
        <button class="rm-btn" onclick="removeItem(${it.id})" aria-label="${it.name}を1つ減らす">−</button>
      </div>`
    ).join("");
  }
  const sub=calcSubtotal();
  const tax=calcTax(sub);
  const disc=calcDiscount(sub);
  const total=calcTotal();
  const earn=calcEarnPts();
  document.getElementById("s-subtotal").textContent="¥"+sub.toLocaleString();
  document.getElementById("s-tax-label").textContent=`消費税（${taxRate}%）`;
  document.getElementById("s-tax").textContent="¥"+tax.toLocaleString();
  const dr=document.getElementById("s-disc-row");
  if(disc>0){dr.style.display="";document.getElementById("s-disc").textContent="-¥"+disc.toLocaleString();}
  else dr.style.display="none";
  const pr=document.getElementById("s-pts-row");
  if(usingPts>0){pr.style.display="";document.getElementById("s-pts-use").textContent="-¥"+usingPts.toLocaleString();}
  else pr.style.display="none";
  document.getElementById("s-total").textContent="¥"+total.toLocaleString();
  const pe=document.getElementById("pts-earn-row");
  if(cart.length>0&&currentMember){pe.style.display="";pe.textContent=`+${earn}ポイント獲得予定`;}
  else pe.style.display="none";
  document.getElementById("pay-btn").disabled=cart.length===0;
}

function setTax(r){
  taxRate=r;
  document.getElementById("tt10").classList.toggle("on",r===10);
  document.getElementById("tt8").classList.toggle("on",r===8);
  renderReceipt();
}

function applyCoupon(){
  const code=document.getElementById("coupon-input").value.trim().toUpperCase();
  const msg=document.getElementById("coupon-msg");
  if(!code){msg.innerHTML=`<span class="err-msg">コードを入力してください</span>`;return;}
  if(COUPONS[code]){
    coupon=COUPONS[code];
    msg.innerHTML=`<span class="coupon-applied"><i class="ti ti-check" aria-hidden="true" style="font-size:12px;vertical-align:-1px;margin-right:2px"></i>${coupon.label}が適用されました</span>`;
    usingPts=0;
    renderReceipt();
  } else {
    msg.innerHTML=`<span class="err-msg">そのコードは使えません</span>`;
    coupon=null;
  }
}

function usePts(){
  if(!currentMember){showToast("会員登録が必要です");return;}
  if(currentMember.pts<=0){showToast("ポイントがありません");return;}
  if(cart.length===0){showToast("商品を選んでください");return;}
  const sub=calcSubtotal();
  const disc=calcDiscount(sub);
  const afterDisc=Math.max(0,sub-disc);
  const maxUse=Math.min(currentMember.pts,afterDisc);
  if(usingPts>0){usingPts=0;showToast("ポイント利用をキャンセルしました");}
  else{usingPts=maxUse;showToast(`${maxUse}ポイント使います`);}
  renderReceipt();
}

function showToast(msg){
  const t=document.createElement("div");
  t.textContent=msg;
  Object.assign(t.style,{position:"absolute",bottom:"60px",left:"50%",transform:"translateX(-50%)",background:"#1a1a2e",color:"#fff",fontSize:"12px",padding:"6px 14px",borderRadius:"20px",zIndex:"200",whiteSpace:"nowrap",transition:"opacity .3s"});
  document.querySelector("div[style='position:relative']").appendChild(t);
  setTimeout(()=>{t.style.opacity="0";setTimeout(()=>t.remove(),300)},1800);
}

function renderMemberDisplay(){
  const el=document.getElementById("member-display");
  const badge=document.getElementById("member-badge");
  if(currentMember){
    el.innerHTML=`<div class="member-card" style="margin:0;border-radius:0;border-left:none;border-right:none;border-top:none">
      <div class="member-avatar">${currentMember.initials}</div>
      <div><div class="member-name">${currentMember.name}</div>
      <div class="member-pts"><i class="ti ti-star" aria-hidden="true" style="font-size:11px;vertical-align:-1px;margin-right:2px"></i>${currentMember.pts}pt 保有</div></div>
      <button class="member-logout" onclick="logoutMember()" aria-label="会員を外す"><i class="ti ti-x" aria-hidden="true" style="font-size:13px"></i></button>
    </div>`;
    badge.innerHTML=`<i class="ti ti-user" aria-hidden="true" style="font-size:12px;vertical-align:-1px;margin-right:3px"></i>${currentMember.name.split(" ")[0]}`;
    badge.className="member-badge has-member";
  } else {
    el.innerHTML="";
    badge.innerHTML=`<i class="ti ti-user" aria-hidden="true" style="font-size:12px;vertical-align:-1px;margin-right:3px"></i>会員`;
    badge.className="member-badge";
  }
  renderReceipt();
}

function logoutMember(){currentMember=null;usingPts=0;renderMemberDisplay();}

function openMemberModal(){
  showOverlay(`
    <div class="modal">
      <div class="modal-title"><i class="ti ti-users" aria-hidden="true" style="font-size:16px;vertical-align:-2px;margin-right:6px"></i>会員を選ぶ</div>
      <div class="members-list">
        ${MEMBERS.map(m=>`
          <div class="mlist-item" onclick="selectMember(${m.id})">
            <div class="member-avatar" style="width:32px;height:32px;font-size:12px">${m.initials}</div>
            <div><div class="mlist-name">${m.name}</div><div class="mlist-pts">${m.pts}pt</div></div>
            <span class="tag ${m.pts>=300?"tag-green":m.pts>=100?"tag-amber":"tag-red"}" style="margin-left:auto">${m.pts>=300?"ゴールド":m.pts>=100?"シルバー":"スタンダード"}</span>
          </div>`).join("")}
      </div>
      <a class="new-member-link" onclick="openNewMemberModal()"><i class="ti ti-plus" aria-hidden="true" style="font-size:13px;vertical-align:-1px;margin-right:3px"></i>新規会員登録</a>
      <div class="modal-btns" style="margin-top:12px">
        <button class="mbtn-cancel" onclick="closeOverlay()">キャンセル</button>
      </div>
    </div>
  `);
}

function selectMember(id){
  currentMember=MEMBERS.find(m=>m.id===id);
  usingPts=0;
  closeOverlay();
  renderMemberDisplay();
}

function openNewMemberModal(){
  showOverlay(`
    <div class="modal">
      <div class="modal-title"><i class="ti ti-user-plus" aria-hidden="true" style="font-size:16px;vertical-align:-2px;margin-right:6px"></i>新規会員登録</div>
      <input id="new-name" placeholder="お名前（例: 佐藤 けんじ）" />
      <div id="new-err"></div>
      <div class="modal-btns">
        <button class="mbtn-cancel" onclick="openMemberModal()">戻る</button>
        <button class="mbtn-primary" onclick="registerMember()">登録する</button>
      </div>
    </div>
  `);
}

function registerMember(){
  const name=document.getElementById("new-name").value.trim();
  if(!name){document.getElementById("new-err").innerHTML=`<span class="err-msg">名前を入力してください</span>`;return;}
  const initials=name.charAt(0);
  const newM={id:Date.now(),name,pts:0,initials};
  MEMBERS.push(newM);
  currentMember=newM;
  usingPts=0;
  closeOverlay();
  renderMemberDisplay();
  showToast(`${name} さんを登録しました`);
}

function openPayModal(){
  const total=calcTotal();
  const earn=calcEarnPts();
  showOverlay(`
    <div class="modal complete-modal">
      <span class="complete-emoji">🎉</span>
      <div class="complete-ttl">ありがとうございました！</div>
      <div class="complete-sub">${taxRate===8?"🛍 お持ち帰り（8%）":"🪑 イートイン（10%）"}</div>
      <div class="complete-total">¥${total.toLocaleString()}</div>
      ${currentMember?`<div class="pt-earned"><i class="ti ti-star" aria-hidden="true" style="font-size:12px;vertical-align:-1px;margin-right:3px"></i>+${earn}ポイント獲得！</div>`:""}
      <button class="mbtn-primary" style="width:100%;margin-bottom:8px" onclick="completePayment()">
        <i class="ti ti-arrow-back-up" aria-hidden="true" style="font-size:14px;vertical-align:-2px;margin-right:5px"></i>次のお客さん
      </button>
    </div>
  `);
}

function completePayment(){
  if(currentMember){
    const earn=calcEarnPts();
    currentMember.pts=Math.max(0,currentMember.pts-usingPts)+earn;
  }
  cart=[];coupon=null;usingPts=0;
  document.getElementById("coupon-input").value="";
  document.getElementById("coupon-msg").innerHTML="";
  closeOverlay();
  renderMemberDisplay();
  renderReceipt();
}

function showOverlay(html){
  const oa=document.getElementById("overlay-area");
  const wrap=document.createElement("div");
  wrap.style.cssText="position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;min-height:680px";
  wrap.id="modal-overlay";
  wrap.innerHTML=html;
  oa.appendChild(wrap);
}
function closeOverlay(){
  const el=document.getElementById("modal-overlay");
  if(el)el.remove();
}

renderCats();renderProducts();renderMemberDisplay();
</script>
